services:
  pos-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: 4b-easy-pos-server:local
    container_name: 4b-easy-pos-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: production
      NODE_ENV: production
      PORT: 3001
      STORAGE_DRIVER: mongo
      BIO_DEMO_MODE: "false"
    ports:
      - "3001:3001"
